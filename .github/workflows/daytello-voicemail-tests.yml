name: DayTello voicemail receiver tests

on:
  push:
    branches:
      - feature/daytello-voicemail-receiver-20261026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voicemail-unit-tests:
    name: Verify voicemail intake (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run offline voicemail unit tests
        run: |
          python -m unittest discover -s tests -p 'test_voicemail*.py' -v
          python -m unittest discover -s tests -p 'test_daytello_oauth*.py' -v
