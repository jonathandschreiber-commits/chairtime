name: Backend Python tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-python-tests.yml"
  push:
    branches:
      - main
      - feature/daytello-twilio-readonly-check-20261106
    paths:
      - "backend/**"
      - ".github/workflows/backend-python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-unittest:
    name: Python unittest (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite:///${{ runner.temp }}/daytello-test.db
      DAYTELLO_VOICE_RELAY_TEST_ONLY: "false"
      DAYTELLO_VOICE_RELAY_PURCHASE_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Twilio connectivity unit tests
        run: python -m unittest discover -s tests -p "test_twilio_provider_connectivity.py" -v
      - name: Run entire backend unit test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
